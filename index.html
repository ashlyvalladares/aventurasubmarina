            El buceo permite al ser humano entrar en un

<!-- =====================================================
     HISTORIA
===================================================== -->

<section id="historia" class="historia">


    <div class="section-title">


        <p>

            HISTORIA DEL BUCEO

        </p>



        <h2>

            ¿De dónde nació<br>

            el buceo moderno?

        </h2>


    </div>



    <div class="historia-content">


        <div class="historia-image">


            <!-- CAMBIA ESTA IMAGEN -->

            <img src="Jacques-Yves Cousteau.jpeg"
                 alt="Jacques Cousteau">


        </div>



        <div class="historia-text">


            <span class="year">

                1943

            </span>



            <h3>

                El nacimiento del buceo autónomo moderno

            </h3>



            <p>

                Aunque los seres humanos ya habían creado
                diferentes equipos para trabajar y explorar
                bajo el agua, un momento fundamental para el
                buceo moderno ocurrió en 1943.

            </p>



            <p>

                El explorador francés Jacques-Yves Cousteau
                y el ingeniero Émile Gagnan desarrollaron
                un sistema de respiración autónomo conocido
                como Aqua-Lung.

            </p>



            <p>

                El nuevo sistema utilizaba un regulador que
                permitía proporcionar aire al buceador cuando
                lo necesitaba. Esto hizo posible permanecer
                bajo el agua con mayor libertad y ayudó a
                popularizar la exploración submarina.

            </p>



            <p>

                Con el tiempo, esta tecnología contribuyó al
                desarrollo del buceo recreativo, científico,
                arqueológico y profesional.

            </p>


        </div>


    </div>


</section>

                🐠

            </p>


        </article>


    </div>


</section>
